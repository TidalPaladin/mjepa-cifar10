id: lejepa-target-stopgrad-v1-smoke
question: Does a shared-weight, stopped prediction target complete one masked multiview training cycle without creating an EMA teacher or disconnecting auxiliary full-view gradients?
hypothesis: The new target boundary will train, validate, checkpoint, and emit finite collapse diagnostics while the predictor, masked context branch, SigREG, invariance, and patch-residual paths remain active.
rejection_condition: Reject the mechanical implementation if the run creates teacher parameters, fails one train-validation-checkpoint cycle, produces nonfinite metrics, or cannot recover and summarize its artifacts.
checkpoint_plan: Retain the smoke checkpoint, backbone, curve, W&B run, and lifecycle evidence. No destructive retention is authorized.

baseline:
  id: target-stopgrad-smoke
  config: config/pretrain/vit-small-lejepa-target-stopgrad-smoke.yaml
  hypothesis: One epoch is sufficient to exercise the new prediction-target boundary before scientific comparison.
  mechanism: Reuse the student for the unmasked forward, detach only features consumed as masked-prediction targets, and leave every auxiliary full-view objective connected.
  changes:
    - Enable stop_gradient_target with target_encoder_mode shared.
    - Shorten the fixed 40-epoch candidate to one mechanical epoch.

variants: []

methodology:
  linked_program: lejepa-target-stopgrad-v1
  purpose: Mechanical validation only; accuracy and collapse values are not scientific evidence.
  invariants:
    - No teacher module or EMA parameter copy is instantiated.
    - The first global view remains the masked-prediction anchor.
    - Visual and auxiliary CLS prediction targets are detached at the loss boundary.
    - Target and additional-view SigREG, multiview invariance, and patch-residual SigREG retain shared-student gradients.
    - Final full-view CLS features remain detached at the online-classifier boundary.
    - The official test set is prohibited.
  stopping:
    - Complete the configured cycle unless a safety or mechanical failure requires repair.
    - Never promote, confirm, or select from smoke metrics.
  retention: Retain every smoke artifact. No destructive retention is authorized.

data: ${CIFAR10_DATA}
log_root: logs/research
model_class: vit-small
seeds: [0]

wandb:
