id: lejepa-masked-collapse-v1-patch-smoke
question: Does direct CLS-plus-patch-mean SigREG complete one deterministic shared-target masked train-validation-checkpoint cycle?
hypothesis: The patch-aware loss will preserve shared-target gradients, update the predictor and student, keep the probe boundary detached, and emit finite collapse diagnostics.

baseline:
  id: clspatch-deterministic-smoke
  config: config/pretrain/vit-small-lejepa-clspatch-smoke.yaml
  hypothesis: One epoch is sufficient to mechanically exercise the new feature-source path before scientific trials.
  mechanism: Apply direct SigREG to context and target CLS embeddings and patch means at lambda 0.20 without auxiliary CLS prediction or stochastic regularizers.
  changes:
    - Add pooled visual features to the SigREG input.
    - Disable auxiliary CLS prediction.
    - Remove attention dropout, hidden dropout, and stochastic depth.

variants: []

methodology:
  linked_program: lejepa-masked-v1
  scientific_run: false
  exclusion: This one-epoch mechanical run is excluded from the user-authorized 22 scientific pretraining runs.
  success:
    - Finite prediction, SigREG, total, probe, and collapse metrics.
    - Student and predictor gradients satisfy their declared boundaries.
    - The full-view shared target retains gradients for self-supervision while its probe input remains detached.
    - Validation metrics, checkpoint, backbone, first-cycle event, terminal event, and online W&B provenance are durable.
  retention: Retain checkpoint and backbone; destructive retention is not authorized.

data: ${CIFAR10_DATA}
log_root: logs/research
model_class: vit-small
seeds: [0]

wandb:
  entity: tidalpaladin
  project: mjepa-cifar10
  group: lejepa-masked-collapse-v1-patch-smoke
  authorized: true
  approved_data_classes: [metrics, configs, provenance]
  emitted_data_classes:
