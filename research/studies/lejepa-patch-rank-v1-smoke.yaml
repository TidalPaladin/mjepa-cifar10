id: lejepa-patch-rank-v1-smoke
question: Does cross-sample patch SigREG complete one teacher-free masked multiview training cycle with connected shared-student gradients?
hypothesis: The new patch-sample loss will train, validate, and checkpoint while treating the image batch as the SigREG token axis at each full-view patch position.

baseline:
  id: patch-sample050-smoke
  config: config/pretrain/vit-small-lejepa-patch-rank-sample050-smoke.yaml
  hypothesis: One epoch is sufficient to validate the new opt-in computation and reduction path before scientific screening.
  mechanism: Combine the established within-image patch-residual term with cross-sample patch SigREG at weight 0.05.
  changes:
    - Add patch-sample SigREG with 32 deterministic slices and weight 0.05.
    - Shorten training from 40 epochs to one mechanical epoch.

variants: []

methodology:
  linked_program: lejepa-patch-rank-v1
  purpose: Mechanical validation only; accuracy and collapse values are not scientific evidence.
  invariants:
    - The target encoder mode remains shared and no teacher is instantiated.
    - Masked-target, additional-view, patch-residual, and patch-sample objectives retain student gradients.
    - The online classifier receives detached CLS features and cannot update the encoder.
    - The official test set is prohibited.
  stopping:
    - Complete the configured cycle unless a safety or mechanical failure requires repair.
    - Never promote, confirm, or select from smoke metrics.
  retention: Retain the smoke checkpoint, metrics, W&B record, and lifecycle artifacts.

data: ${CIFAR10_DATA}
log_root: logs/research
model_class: vit-small
seeds: [0]

wandb:
