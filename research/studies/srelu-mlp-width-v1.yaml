  selection:
    qualifying_thresholds: Use the promotion block without modification.
    ranking: Common-horizon active-time AUC, peak validation accuracy, active seconds to the fixed 95 percent target, then supervisor wall time.
    next_stage: If a candidate qualifies, use the top-ranked candidate for directional tuning. Otherwise use the Pareto-best SReLU by peak accuracy and active-time AUC without calling it promoted.
  metrics:
    - optimizer step and cumulative trainer-active wall seconds to fixed 90 and 95 percent baseline targets
    - peak and final online-probe validation accuracy
    - validation-accuracy AUC over common optimizer-step and trainer-active-time horizons
    - supervisor start-to-finish wall seconds
