id: srelu-mlp-width-v1
question: Which Squared ReLU FFN width best matches or improves the SwiGLU seed-0 baseline under nominal-width, compute-equivalent, and parameter-equivalent workloads?
hypothesis: The tensor-core-aligned SReLU width 2304 will preserve baseline peak accuracy within 0.005 while improving active-time AUC or time to the fixed 95 percent target enough to qualify for directional tuning.
rejection_condition: Reject the width hypothesis if no SReLU candidate meets a promotion threshold against the immutable SwiGLU curve. Continue only with the nonqualifying Pareto-best SReLU when the linked protocol still authorizes directional tuning.
checkpoint_plan: Retain the baseline reference outside managed retention. Retain candidate checkpoints through width analysis and directional preregistration; delete only terminal rejected managed weights after their result and disposition are committed and pushed.

baseline:
  id: swiglu-fixed-v1
  config: config/pretrain/vit-small-four-cls-legacy.yaml
  hypothesis: The completed seed-0 SwiGLU curve remains the immutable comparator for the linked SReLU width and tuning screens.
  mechanism: Reuse the exact validation curve from srelu-mlp-baseline-v1 without scheduling another baseline run.
  changes: []

baseline_reference:
  study_id: srelu-mlp-baseline-v1
  run_id: pretrain-swiglu-baseline-seed0
  metrics: research/baselines/srelu-mlp-baseline-v1-swiglu-seed0.metrics.jsonl
  metrics_sha256: acd548d3b7d2f400a089371b78fd30b7c11af0beef3e49b673c8b181682f8cfc

variants:
  - id: srelu-h1536
    config: config/pretrain/vit-small-srelu-h1536.yaml
    hypothesis: SReLU at the nominal SwiGLU up-projection width reduces wall time substantially enough to offset its lower parameter count without losing more than 0.005 peak accuracy.
    mechanism: Replace gated SwiGLU with Squared ReLU while retaining FFN width 1536, all attention shapes, depth, optimizer settings, and dropout.
    changes:
      - Set activation to srelu at FFN width 1536.
      - Preserve attention, depth, AdamW learning rate 0.002, weight decay 0.2, and MLP dropout 0.1.
  - id: srelu-h2304
    config: config/pretrain/vit-small-srelu-h2304.yaml
    hypothesis: Tensor-core-aligned SReLU width 2304 provides the best same-workload tradeoff by matching SwiGLU parameter count and measured component latency while improving convergence.
    mechanism: Replace gated SwiGLU with Squared ReLU and expand the up-projection to the aligned compute-equivalent width 2304.
    changes:
      - Set activation to srelu and FFN width to 2304.
      - Preserve attention, depth, AdamW learning rate 0.002, weight decay 0.2, and MLP dropout 0.1.
  - id: srelu-h2305
    config: config/pretrain/vit-small-srelu-h2305.yaml
    hypothesis: Exact parameter-equivalent SReLU width 2305 preserves SwiGLU accuracy and reveals whether alignment, rather than parameter count, determines wall-clock performance.
    mechanism: Replace gated SwiGLU with Squared ReLU and expand the up-projection to exact parameter-equivalent width 2305.
    changes:
      - Set activation to srelu and FFN width to 2305.
      - Preserve attention, depth, AdamW learning rate 0.002, weight decay 0.2, and MLP dropout 0.1.

