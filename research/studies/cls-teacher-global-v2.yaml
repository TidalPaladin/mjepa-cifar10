id: cls-teacher-global-v2
question: Can a centered normalized full-teacher target make one hard-blind CLS token match the accepted independent four-partition predictor while preserving one backbone CLS token and one predictor forward?
hypothesis: Removing raw target norm and common-mode information will avoid the representation shrinkage seen with direct raw-mean MSE. Fixed-mean or learned EMA-attention pooling will improve seed-0 peak validation accuracy by at least 0.05 over a fresh packed hard-blind control; a qualifying candidate will trail a fresh independent-partition baseline by no more than 0.005 while reducing common-step active time and isolated CLS-path latency by at least 5 percent.
rejection_condition: Reject the mechanism if neither pooled target passes the fresh hard-blind control-gain gate and the fresh independent-partition cost gate at seed 0, if its stopped target collapses across samples, if its final CLS shuffle gap is nonpositive, or if the direct CLS loss reads student visual tokens or propagates gradients into teacher features. Do not add fallback targets, weights, or poolers after observing results.
checkpoint_plan: Retain every checkpoint and backbone because destructive retention is not authorized. Never delete legacy or unmanaged weights.

baseline:
  id: single-cls-register-partitioned-independent
  config: config/pretrain/vit-small-single-cls-register-partitioned-independent.yaml
  finetune_config: config/finetune/vit-small-single-cls.yaml
  hypothesis: The accepted independent four-partition readout provides a fresh quality, convergence, and complete predictor-workload reference.
  mechanism: Preserve one CLS plus seven registers, independently lift four disjoint CLS channel partitions, and use separate visual-context and CLS-context predictor forwards.
  changes: []

variants:
  - id: single-cls-packed-adaln-hard-blind-control
    config: config/pretrain/vit-small-single-cls-packed-adaln-hard-blind.yaml
    finetune_config: config/finetune/vit-small-single-cls.yaml
    hypothesis: Repeating the simplest and fastest stage-1 hard-blind path provides the paired seed-0 control for target-driven recovery.
    mechanism: Use packed visual and hard-blind CLS-conditioned target copies without any teacher-global objective.
    changes:
      - Preserve one CLS plus seven registers and one predictor forward.
      - Add no teacher-global target or pooling module.
  - id: cls-global-centered-mean
    config: config/pretrain/vit-small-single-cls-packed-adaln-hard-blind-global-mean.yaml
    finetune_config: config/finetune/vit-small-single-cls.yaml
    hypothesis: Centered normalized arithmetic pooling supplies a stable global target without the norm-shrink incentive of raw MSE.
    mechanism: Regress the centered normalized student CLS and visible-token mean to the stopped centered normalized mean of all full-image teacher visual tokens.
    changes:
      - Preserve the packed hard-blind architecture and patch losses.
      - Add direct CLS and visible-pool squared-L2 losses at weight 0.1 each.
      - Add no trainable pooling parameters.
  - id: cls-global-centered-ema-attention
    config: config/pretrain/vit-small-single-cls-packed-adaln-hard-blind-global-ema-attention.yaml
    finetune_config: config/finetune/vit-small-single-cls.yaml
    hypothesis: A learned EMA attention pooler will select globally useful teacher content better than uniform pooling while retaining a stopped target.
    mechanism: Regress the centered normalized student CLS and an online one-query attention pool of visible student tokens to a stopped centered normalized EMA-attention pool of every full-image teacher visual token.
    changes:
      - Preserve the packed hard-blind architecture and patch losses.
      - Add direct CLS and visible-pool squared-L2 losses at weight 0.1 each.
      - Train the online pooler through visible-to-full consistency and update its target copy with the backbone teacher momentum.

methodology:
  source_studies:
    - cls-global-target-v1
    - cls-partitioned-slots-v1
    - cls-adaln-hard-blind-v2
  preregistration_operation: cls-teacher-global-v2-preregistration
  prior_evidence:
    - One backbone CLS token with independent four-partition readout reached 0.8988 peak validation accuracy, so the backbone bottleneck can retain sufficient information.
    - Plain packed hard-blind AdaLN reached 0.7890, its adapter reached 0.7982, and its token mixer reached 0.8046 versus the fresh 0.8988 baseline.
    - Ordered but small adapter and mixer gains identify the decoder target or interface as the remaining limitation rather than general collapse.
    - Raw arithmetic-mean MSE reduced performance as its weight increased and strongly reduced both student and teacher norms, motivating center and scale removal.
  information_boundary:
    backbone_cls_tokens: 1
    backbone_register_tokens: 7
    patch_predictor_forwards: 1
    patch_visual_route: Visible final student visual tokens through ordinary cross-attention.
    patch_blind_route: Final student CLS token through AdaLN while exactly skipping visual cross-attention.
    direct_cls_loss_student_input: The only final student CLS token.
    direct_cls_loss_exclusions: Student visual tokens, registers, predictor visual residuals, teacher gradients, intermediate features, and other samples.
    teacher_target_input: Every full-image EMA-teacher visual token before masking.
    teacher_target_stop_rule: Detach the pooled teacher embedding before centering, normalization, and both regression losses.
    visible_pool_loss: A separate consistency path may update visible student visual tokens and the online pooler but cannot feed those tokens into the direct CLS loss.
  target_transform:
    order:
      - Pool visual tokens to one embedding.
      - Subtract that embedding's mean across channels.
      - L2-normalize across channels.
      - Stop all teacher-target gradients.
    loss: Squared L2 distance between unit embeddings, equivalent to twice cosine distance.
    cls_loss_weight: 0.1
    visible_pool_consistency_loss_weight: 0.1
    weight_rationale: A post-hoc batch from the completed hard-blind control gave direct and visible-pool losses of 1.201 and 0.270, so weights of 0.1 add approximately 0.147 total loss, comparable to one JEPA route without dominating it.
  fixed_mean_pooling:
    teacher: Arithmetic mean of all full-image teacher visual tokens.
    student: Arithmetic mean of visible final student visual tokens.
    trainable_parameters: 0
  ema_attention_pooling:
    queries: 1
    attention_heads: 12
    dropout: 0.0
    normalization: Match the backbone LayerNorm and QK normalization.
    online_input: Visible final student visual tokens.
    target_input: All full-image teacher visual tokens.
    initialization: Exact frozen copy of the online pooler.
    update: EMA after each optimizer step at the same 0.98 unscheduled momentum as the backbone teacher.
    checkpointing: Store both poolers inside the predictor checkpoint; downstream backbone artifacts remain unchanged.
  validation_diagnostics:
    batch: First deterministic validation batch at each validation interval.
    metrics:
      - true and cross-sample-shuffled centered normalized CLS loss
      - shuffled-minus-true CLS loss gap
      - visible-pool consistency loss
      - teacher-target mean cross-sample channel standard deviation
      - normalized student and teacher embedding norms
      - hard-blind patch loss and shuffled loss
      - CLS-patch alignment
      - online-probe validation accuracy
  screening:
    runs: Fresh independent-partition baseline, fresh packed hard-blind control, fixed-mean target, and EMA-attention target at seed 0.
    mechanical_gate: Candidate must use one CLS, seven registers, one predictor forward, a finite positive final target batch standard deviation, and a positive final CLS shuffle gap.
    control_gate: Candidate peak validation accuracy must exceed the fresh hard-blind control by at least 0.05.
    cost_gate: Candidate common-step active time and isolated median latency must each improve by at least 5 percent versus the fresh independent-partition baseline.
    quality_floor: Candidate peak validation accuracy may trail the fresh independent-partition baseline by no more than 0.005.
    disabled_routes: Accuracy-only, time-to-95-only, and active-time-AUC-only promotion are disabled for this mechanism test.
    ranking: Peak validation accuracy, common-horizon active-time AUC, active seconds to the fixed 95-percent target, then isolated latency.
    no_fallback_variants: true
  confirmation:
    runs: Fresh independent-partition baseline and selected winner at seeds 1 and 2, for eight total scientific pretraining trials.
    rule: The three-seed mean must meet the cost route, at least two paired seeds must improve active time and isolated latency, and the seed-0 winner must retain the hard-blind control accuracy gain.
  evaluation:
    trigger: Confirmed winner only.
    regimes: Full data, 10 shots per class, and 100 shots per class.
    seeds: [0, 1, 2]
    official_test_scope: Confirmed baseline and winner only.

