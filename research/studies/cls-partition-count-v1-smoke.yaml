id: cls-partition-count-v1-smoke
question: Can the generalized eight-partition single-CLS path train, validate, benchmark, checkpoint, recover, summarize, and notify through one managed GPU epoch?
hypothesis: The maximum requested partition count will complete with one backbone CLS token, seven registers, isolated channel-group gradients, exact-path diagnostics, an isolated-path benchmark, a first-cycle checkpoint, and accepted lifecycle notifications.
rejection_condition: Reject the mechanical validation if the run fails, times out, lacks gradients for any channel group or required recovery artifacts, creates a context with other than eight tokens, recomputes a different auxiliary path for diagnostics, cannot summarize, or its lifecycle notification is not accepted.
checkpoint_plan: Retain the smoke checkpoint through scientific launch validation. Never delete legacy or unmanaged weights.

baseline:
  id: cls-register-partitioned-independent-8-smoke
  config: config/pretrain/smoke-cls-register-partitioned-independent-8.yaml
  hypothesis: A one-epoch miniature model exercises all eight independent channel lifts and the unchanged legacy predictor without register or visual-token leakage.
  mechanism: Run one CLS token plus seven registers, split only the CLS into eight disjoint channel groups, and independently lift the groups into eight auxiliary predictor contexts.
  changes:
    - Use one CLS token and seven register tokens.
    - Use eight partitioned_independent_cross_attention contexts for the auxiliary predictor.

variants: []
data: ${CIFAR10_DATA}
log_root: logs/research
model_class: vit-smoke
seeds: [0, 1, 2]

