id: lejepa-convergence-v1-optimizer-smoke
question: Does the calibrated detached online-probe parameter group complete the full managed multiview training lifecycle?
hypothesis: A one-epoch run will train, validate, checkpoint, publish online metrics, emit first-cycle and terminal events, and preserve the shared-student gradient boundary.

baseline:
  id: g2l2-probe-group-smoke
  config: config/pretrain/vit-small-lejepa-convergence-probe-group-smoke.yaml
  hypothesis: The exact objective and calibrated probe group are mechanically valid before the scientific optimizer screen.
  mechanism: Run one epoch of the optimizer-screen baseline with validation every epoch.
  changes:
    - Shorten the scientific baseline from 100 epochs to one mechanical epoch.

variants: []

methodology:
  linked_program: lejepa-convergence-v1
  purpose: Mechanical validation only; accuracy and collapse values are not scientific evidence.
  controls:
    seed: 0
    effective_batch_size: 1024
    data_split: fixed-45000-train-5000-validation
    official_test_set: prohibited
    probe_boundary: Detached final CLS with head learning rate 0.01, weight decay 1e-6, and no dropout.
  stopping:
    - Complete the one configured run unless a safety or mechanical failure requires repair.
    - Never promote or confirm a smoke result.
  retention: Retain the smoke checkpoint and lifecycle artifacts.

data: ${CIFAR10_DATA}
log_root: logs/research
model_class: vit-small
seeds: [0]

wandb:
  entity: tidalpaladin
  project: mjepa-cifar10
  group: lejepa-convergence-v1-optimizer-smoke
  authorized: true
  approved_data_classes: [metrics, configs, provenance]
  emitted_data_classes:
    launch: [metrics, configs, provenance]
    summary: [metrics, provenance]

code_shas:
  parent: REQUIRED
  mjepa: 8f9eab6beb6a0e1f9547e90ed8ce0d5e7bde42c6
  vit: bf15705454975f04912538cdc790d399eea69e67

resources:
  physical_gpus: [1, 2]
  max_concurrent_jobs: 1
  timeout_seconds: 3600
  max_pretraining_trials: 1
  minimum_free_gib: 50
  fallback_checkpoint_gib: 3

promotion:
  accuracy_gain: 1.0
  convergence_gain: 0.99
  auc_gain: 1.0
  maximum_accuracy_loss: 0.0

evaluation:
  finetune_config: null
  shots_per_class: [null]
  seeds: [0]
  official_test_roles: []
