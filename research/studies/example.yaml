id: example-jepa-study
question: Does the proposed JEPA mechanism improve validation probe convergence on CIFAR-10?
hypothesis: The proposed mechanism will improve fixed-target active time or common-horizon AUC without reducing peak probe accuracy beyond the promotion limit.

baseline:
  id: baseline
  config: config/pretrain/vit-tiny.yaml
  hypothesis: Current MJEPA configuration.
  mechanism: Existing teacher-target prediction path.
  changes: []

variants:
  - id: candidate-a
    config: config/pretrain/vit-tiny-candidate-a.yaml
    hypothesis: Replace this text with the mechanism and expected effect.
    mechanism: Replace this text with the causal mechanism.
    changes:
      - Replace this entry with an exact code or configuration change.

data: ${CIFAR10_DATA}
log_root: logs/research
model_class: vit-tiny
seeds: [0, 1, 2]

wandb:
  entity: replace-me
  project: mjepa-cifar10
  group: example-jepa-study
  authorized: true
  approved_data_classes: [metrics, configs, provenance]
  emitted_data_classes:
    launch: [metrics, configs, provenance]
    summary: [metrics, provenance]

code_shas:
  parent: REQUIRED
  mjepa: REQUIRED
  vit: REQUIRED

resources:
  physical_gpus: [1, 2]
  max_concurrent_jobs: 2
  timeout_seconds: 86400
  max_pretraining_trials: 8
  minimum_free_gib: 50
  fallback_checkpoint_gib: 3

promotion:
  accuracy_gain: 0.01
  convergence_gain: 0.15
  auc_gain: 0.10
  maximum_accuracy_loss: 0.005

evaluation:
  finetune_config: config/finetune/vit-tiny.yaml
  shots_per_class: [null, 10, 100]
  seeds: [0, 1, 2]
  official_test_roles: [baseline, winner]
