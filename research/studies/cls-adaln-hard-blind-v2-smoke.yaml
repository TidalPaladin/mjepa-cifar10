id: cls-adaln-hard-blind-v2-smoke
question: Can packed hard-blind AdaLN predict every teacher target once from visual context and once from one CLS token in one managed predictor forward without source leakage?
hypothesis: The one-epoch shared-core path will produce two predictions per target, keep blind-query gradients independent of student visual tokens, give nonzero CLS gradients, emit finite route-normalized losses and diagnostics, checkpoint, recover, summarize, and notify.
rejection_condition: Reject the mechanical validation if the run fails, times out, executes more than one training predictor forward, produces other than two predictions per target, exposes student visual tokens to blind queries, lacks CLS or predictor gradients, emits nonfinite loss, lacks recovery artifacts, cannot summarize, or its lifecycle notification is not accepted.
checkpoint_plan: Retain the smoke checkpoint through scientific launch validation. Retain all managed checkpoints unless the user later authorizes deletion. Never delete legacy or unmanaged weights.

baseline:
  id: cls-packed-adaln-hard-blind-smoke
  config: config/pretrain/smoke-cls-packed-adaln-hard-blind.yaml
  hypothesis: Immediate mild AdaLN modulation plus a unit residual gate will train the shared visual and blind routes without the cold-start behavior of AdaLN-Zero.
  mechanism: For every target position, run one query through visual cross-attention with null conditioning and a duplicate query through the same AdaLN MLP with one student CLS embedding while skipping the blind cross-attention residual exactly.
  changes:
    - Preserve one backbone CLS token plus seven register tokens.
    - Execute one predictor forward with one visual and one blind prediction per spatial target.
    - Initialize AdaLN modulation weights at standard deviation 0.001 and its residual gate at 1.0.
    - Sum separately normalized visual-route and blind-route prediction losses.

