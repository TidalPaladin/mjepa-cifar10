id: ijepa-token-specialization-v2-no-registers
question: Do separate global/visual encoder pathways make register tokens unnecessary for I-JEPA global quality and patch-token specialization?
hypothesis: With specialized normalization, LayerScale, and early QKV paths, removing all seven register tokens will preserve the seven-register model's online CLS-probe curve and layerwise patch geometry because the dedicated global pathway already prevents global and visual features from competing for shared parameters.
rejection_condition: Reject the hypothesis if the no-register model collapses, loses more than 0.005 peak or final online accuracy, exceeds 1.10 times the seven-register convergence horizon, loses more than 0.01 common-horizon AUC, loses more than 0.01 final CLS or patch-mean centroid accuracy, increases final CLS-patch alignment or within-image patch cosine by more than 0.02, or retains less than 90 percent of centered patch energy.
checkpoint_plan: Retain both fresh checkpoints, backbones, curves, layerwise diagnostics, W&B runs, and lifecycle evidence. No destructive retention is authorized.

baseline:
  id: token-specialized-register7
  config: config/pretrain/vit-small-ijepa-token-specialization.yaml
  hypothesis: Seven register tokens remain necessary scratch space even after global and visual token paths are specialized.
  mechanism: Train the landed specialized encoder with one CLS token, seven register tokens, separate global/visual normalization and LayerScale in all blocks, and separate QKV projections in the first four blocks.
  changes: []

variants:
  - id: token-specialized-register0
    config: config/pretrain/vit-small-ijepa-token-specialization-no-registers.yaml
    hypothesis: The dedicated global pathway replaces the role of registers as global-information scratch space without degrading CLS semantics or making visual tokens more global.
    mechanism: Remove all seven register tokens while preserving the specialized global/visual paths and every training choice.
    changes:
      - Set backbone num_register_tokens from 7 to 0.

methodology:
  linked_program: ijepa-token-specialization-v1
  trigger:
    source_study: ijepa-token-specialization-v1-screen
    source_run: pretrain-token-specialized-seed0
    source_peak_online_accuracy: 0.9020000100135803
    source_final_cls_patch_alignment: -0.002502408645447567
    source_final_patch_pairwise_cosine: 0.3442408186710335
    rationale: The specialized model preserved online quality and substantially separated CLS and patch-token geometry. The remaining question is whether its seven registers still provide necessary global scratch capacity.
  mechanical_retry:
    failed_attempt_1: Both paired runs stopped before their first optimizer step when the landed token-specialized attention kernel's dynamic large-batch backward raised an Inductor CantSplit error.
    root_cause: The landed hardening change removed concrete-shape compilation from the specialized attention kernel; the existing batch-size-2 regression did not exercise the batch-size-512 scheduler path.
    regression: A CUDA test now covers batch size 512 with both eight and one global token and reproduces each failed run's compiler path.
    repair: Pin vit 1618b5b08437775e32c4e3f245a74ddf389ccb96, which restores concrete-shape compilation for only the specialized attention kernel while preserving model arithmetic and extends the regression test to both experimental prefix sizes.
    scientific_status: Attempt 1 produced no training metrics and does not count as a scientific observation; both variants retry from initialization as attempt 2 with their existing W&B identities.
  scientific_run_allocation:
    new_pretraining_runs: 2
    seeds: [0]
    concurrent_pair: true
    no_automatic_confirmation: true
  paired_environment:
    shared_seed: 0
    code_revision: Both models use the landed token-specialization implementation from vit PR 120 plus the identical concrete-shape compiler repair recorded above.
    isolation: The two configs differ only in backbone num_register_tokens; the pair launches concurrently on physical GPUs 1 and 2.
    initialization_note: Common parameters use the same seed, but removing prefix tokens changes attention inputs immediately and does not imply functionally identical step-zero outputs.
  controls:
    epochs: 400
    validation_interval_epochs: 10
    effective_batch_size: 1024
    data_split: fixed-45000-train-5000-validation
    official_test_set: prohibited
    masking: Context ratio 0.50, target ratio 0.25, contiguous scale 2.
    objective: Existing visual-token and partitioned independent CLS I-JEPA prediction with the EMA teacher and unchanged SigREG weight.
    specialization: Separate global/visual LayerNorm and LayerScale in all 12 blocks, with separate QKV projections in blocks 1 through 4.
    optimization: AdamW learning rate 0.002, weight decay 0.2, constant rate, and identical parameter-group rules.
    probe_boundary: Final full-view CLS enters the online classifier through the existing explicit detach.
    terminal_diagnostic: Freeze both encoders and apply deterministic normalized nearest-centroid probes for CLS, patch mean, and their concatenation at every block.
  primary_endpoints:
    - Peak and final online CLS-probe accuracy, first-validation accuracy, step and active-time AUC, and time to the fixed 95-percent target.
    - Final and layerwise CLS and patch-mean nearest-centroid accuracy.
    - Final and layerwise CLS-patch alignment, within-image patch cosine, centered patch energy, and centered patch effective rank.
  secondary_endpoints:
    - CLS and patch-mean effective rank, variance, top-eigenvalue fraction, pairwise cosine, parameter count, throughput, and active time.
    - Difference from the historical seven-register specialized curve, reported descriptively rather than used as a gate.
  safety_gate:
    finite_fraction_required: 1.0
    cls_std_mean_minimum: 0.10
    cls_top_eigenvalue_fraction_maximum: 0.50
    cls_mean_pairwise_cosine_maximum: 0.90
    patch_mean_std_mean_minimum: 0.10
    patch_mean_top_eigenvalue_fraction_maximum: 0.50
    patch_mean_mean_pairwise_cosine_maximum: 0.90
  register_negation_gate:
    online_peak_accuracy_loss_maximum: 0.005
    online_final_accuracy_loss_maximum: 0.005
    convergence_ratio_maximum: 1.10
    common_horizon_auc_loss_maximum: 0.01
    final_cls_centroid_accuracy_loss_maximum: 0.01
    final_patch_mean_centroid_accuracy_loss_maximum: 0.01
    final_cls_patch_alignment_increase_maximum: 0.02
    final_patch_pairwise_cosine_increase_maximum: 0.02
    candidate_to_control_centered_patch_energy_ratio_minimum: 0.90
    rule: Conclude that specialization negates the need for registers only if every safety, online-equivalence, semantic-utility, homogenization, and spatial-energy threshold passes against the fresh seven-register control.
  stopping:
    - Run both models through the full 400-epoch horizon unless a nonfinite value, safety event, mechanical failure, or timeout intervenes.
    - Complete the layerwise diagnostic before interpreting whether registers are unnecessary.
    - Do not launch confirmation, fine-tuning, or official-test evaluation.
  retention: Retain every artifact. No destructive retention is authorized.

