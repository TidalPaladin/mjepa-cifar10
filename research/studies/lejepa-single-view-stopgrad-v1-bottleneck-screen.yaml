id: lejepa-single-view-stopgrad-v1-bottleneck-screen
question: Can stronger global or patch-residual SigREG close the measured representation gap of crop-free single-view stopped-target MIM?
hypothesis: The retained crop-free stopped-target run is limited by regularization strength rather than view diversity, so one of two isolated weight increases will materially improve its corresponding frozen-global or patch-level endpoint without sacrificing the other representation path.
rejection_condition: Reject the bottleneck hypothesis if neither isolated candidate passes its pathway-specific response gate, or if both remain outside any preregistered crop-free equivalence threshold versus the immutable multiview reference.
checkpoint_plan: Retain both candidate checkpoints, backbones, curves, probe caches, diagnostics, W&B runs, and lifecycle evidence. No destructive retention is authorized.

baseline:
  id: single-view-target-stopgrad-control
  config: config/pretrain/vit-small-lejepa-single-view-stopgrad-40e.yaml
  hypothesis: The completed seed-0 crop-free stopped-target run defines the exact one-view reference without spending a third pretraining trial.
  mechanism: Reuse the immutable validation curve and retained checkpoint from the completed crop-free screen.
  changes: []

baseline_reference:
  study_id: lejepa-single-view-stopgrad-v1-screen
  run_id: pretrain-single-view-target-stopgrad-seed0
  metrics: research/baselines/lejepa-single-view-stopgrad-v1-control-seed0.metrics.jsonl
  metrics_sha256: 68def35771f8f583b4a2964a55633c042a0c268cd3ebc71a711167da4bc99254

variants:
  - id: single-view-stopgrad-lambda010
    config: config/pretrain/vit-small-lejepa-single-view-stopgrad-lambda010-40e.yaml
    hypothesis: The dominant frozen-CLS deficit reflects insufficient direct SigREG pressure on the single full/masked image pair.
    mechanism: Double the direct LeJEPA regularization coefficient while preserving the crop-free stopped-target MIM formulation.
    changes:
      - Raise lejepa_lambda from 0.05 to 0.10.
      - Hold every other trainer, backbone, objective, view, mask, and optimizer field fixed.
  - id: single-view-stopgrad-patch-residual010
    config: config/pretrain/vit-small-lejepa-single-view-stopgrad-patch-residual010-40e.yaml
    hypothesis: The patch-centroid and patch-cosine deficits reflect insufficient pressure to preserve information after subtracting each image global mean.
    mechanism: Double patch-residual SigREG while preserving the crop-free stopped-target MIM formulation.
    changes:
      - Raise patch_residual_sigreg_loss_weight from 0.05 to 0.10.
      - Hold every other trainer, backbone, objective, view, mask, and optimizer field fixed.

