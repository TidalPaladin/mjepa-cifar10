id: cls-routing-objective-v1-smoke
question: Can packed dual routing duplicate every spatial query, blind each copy to one source, normalize both source losses, and complete one managed GPU epoch through a single predictor forward?
hypothesis: The packed full-coverage design will train without source leakage or nonfinite values, preserve gradients through the visual and CLS routes, emit exact-path diagnostics and executed-query benchmark metadata, checkpoint, recover, summarize, and notify.
rejection_condition: Reject the mechanical validation if the run fails, times out, executes more than one training predictor forward, produces other than two predictions per target, leaks a hidden source, lacks student or predictor gradients, emits nonfinite loss, lacks recovery artifacts, cannot summarize, or its lifecycle notification is not accepted.
checkpoint_plan: Retain the smoke checkpoint through scientific launch validation. Never delete legacy or unmanaged weights.

baseline:
  id: cls-joint-context-packed-dual-routed-smoke
  config: config/pretrain/smoke-cls-joint-context-packed-dual-routed.yaml
  hypothesis: The one-epoch miniature model exercises the largest query workload and the new route-normalized loss path.
  mechanism: Duplicate each target query inside one predictor call, expose one copy only to visual context and the other only to the raw CLS token, and sum separately normalized route losses.
  changes:
    - Use one CLS token and seven register tokens.
    - Execute two predictor queries per spatial target in one packed cross-attention call.
    - Use a JEPA loss coefficient of 1.0 because the two route means are summed explicitly.

