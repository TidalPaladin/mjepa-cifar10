id: cls-teacher-global-v2-convex-smoke
question: Does convex attention-weight pooling prevent the sample-independent collapse of the centered normalized EMA teacher-global target while preserving one CLS token and one patch-predictor forward?
hypothesis: Replacing learned value and output projections with learned query/key weights applied directly to raw visual tokens will raise final target channel standard deviation from 0.000237 to at least 0.005, reduce mean pairwise target cosine below 0.99, retain positive CLS and patch shuffle gaps, update every online pooler parameter and its EMA target, checkpoint, recover, summarize, and notify.
rejection_condition: Reject the mechanical repair if the run fails, times out, uses other than one CLS plus seven registers, executes more than one patch-predictor forward, violates convex nonnegative unit-sum pooling, gives the direct CLS loss a student-visual or teacher gradient, leaves an online-pooler parameter without a gradient or EMA update, has final target channel standard deviation below 0.005, has final mean pairwise target cosine at least 0.99, lacks a positive final CLS or patch shuffle gap, emits a nonfinite metric, lacks recovery artifacts, cannot summarize, or its lifecycle notification is not accepted.
checkpoint_plan: Retain this checkpoint and the rejected full-projection smoke checkpoint. Retain all managed checkpoints unless the user later authorizes deletion. Never delete legacy or unmanaged weights.

baseline:
  id: cls-global-ema-attention-convex-smoke
  config: config/pretrain/smoke-cls-packed-adaln-hard-blind-global-ema-attention-convex.yaml
  hypothesis: A raw-token convex value path preserves teacher feature diversity while learned attention weights retain the capacity to emphasize globally useful tokens.
  mechanism: Center and normalize a convex attention-weighted mean of all teacher visual tokens, regress both the student CLS and a convex online pool of visible student tokens to that stopped target, and retain packed hard-blind AdaLN patch prediction.
  changes:
    - Preserve one backbone CLS token plus seven register tokens and one patch-predictor forward.
    - Learn one query, one key projection, and per-head QK normalization without learned value or output projections.
    - Average per-head softmax weights and apply them directly to raw visual tokens.
    - Add direct CLS and visible-pool squared-L2 losses at weight 0.1 each.
    - Update the target weight pooler with the same EMA momentum as the backbone teacher.

