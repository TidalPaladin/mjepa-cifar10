id: harness-smoke
question: Can a managed one-epoch baseline recover its config, metrics, provenance, checkpoint, resume state, and summary from the study ID?
hypothesis: The research harness will complete one offline baseline run and recover every required artifact after process exit.

baseline:
  id: baseline
  config: config/pretrain/smoke.yaml
  hypothesis: Exercise the harness without testing a scientific JEPA change.
  mechanism: Run the standard JEPA path for one epoch through the managed supervisor.
  changes:
    - Use the committed small smoke model and W&B offline mode.

variants: []
data: ${CIFAR10_DATA}
log_root: logs/research
model_class: vit-smoke
seeds: [0, 1, 2]

wandb:
  entity: tidalpaladin
  project: mjepa-cifar10
  group: harness-smoke

code_shas:
  parent: REQUIRED
  mjepa: 04b33f8e938ab5fea6d863a7871a57aee05e94c7
  vit: f8b40c753d7bea5b9d788b379bda1445af0748aa

resources:
  physical_gpus: [1, 2]
  max_concurrent_jobs: 1
  timeout_seconds: 3600
  max_pretraining_trials: 8
  minimum_free_gib: 50
  fallback_checkpoint_gib: 3

promotion:
  accuracy_gain: 0.01
  convergence_gain: 0.15
  auc_gain: 0.10
  maximum_accuracy_loss: 0.005

evaluation:
  shots_per_class: [null, 10, 100]
  seeds: [0, 1, 2]
  official_test_roles: [baseline, winner]
