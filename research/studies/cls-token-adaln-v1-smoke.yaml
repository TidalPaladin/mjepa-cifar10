id: cls-token-adaln-v1-smoke
question: Can the single-CLS AdaLN path train, validate, benchmark, checkpoint, resume, summarize, and notify through one managed GPU epoch?
hypothesis: The one-epoch adaln-blind smoke run will complete with the isolated path benchmark, true and shuffled CLS diagnostics, valid gradients, recoverable checkpoint metadata, and accepted lifecycle notifications.
rejection_condition: Reject the mechanical validation if the run fails, times out, lacks the benchmark or first-cycle artifacts, cannot resume, cannot summarize, or its notification is not accepted.
checkpoint_plan: Retain the smoke checkpoint through formal launch validation. Do not delete legacy or unmanaged weights.

baseline:
  id: cls-adaln-smoke
  config: config/pretrain/smoke-cls-adaln.yaml
  hypothesis: The committed single-CLS adaln-blind path completes one managed epoch in the explicitly scoped local W&B fallback mode.
  mechanism: Exercise the same blinded shared-MLP path, diagnostics, checkpoint metadata, and startup benchmark used by the formal candidates at smoke scale.
  changes:
    - Use one CLS token and adaln_blind mode.
    - Use a one-block, one-epoch mechanical configuration.

variants: []
data: ${CIFAR10_DATA}
log_root: logs/research
model_class: vit-smoke
seeds: [0, 1, 2]

wandb:
  entity: tidalpaladin
  project: mjepa-cifar10
  group: cls-token-adaln-v1-smoke
  authorized: false
  approved_data_classes: []
  emitted_data_classes:
    launch: [metrics, configs, provenance]
    summary: [metrics, provenance]

code_shas:
  parent: REQUIRED
  mjepa: c63b014aacc1860e18b0f45aca65fad88396b95e
  vit: 67eae23786b8e458334b695be8f8a879d6994a43

resources:
  physical_gpus: [1, 2]
  max_concurrent_jobs: 1
  timeout_seconds: 3600
  max_pretraining_trials: 1
  minimum_free_gib: 50
  fallback_checkpoint_gib: 3

promotion:
  accuracy_gain: 0.01
  convergence_gain: 0.15
  auc_gain: 0.10
  maximum_accuracy_loss: 0.005

evaluation:
  finetune_config: null
  shots_per_class: [null, 10, 100]
  seeds: [0, 1, 2]
  official_test_roles: [baseline, winner]
