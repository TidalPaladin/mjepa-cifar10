id: lejepa-convergence-v1-optimizer-probe
question: Does changing AdamW learning rate, weight decay, or schedule improve the fixed frozen-probe accuracy of the teacher-free SigREG representation?
hypothesis: Lowering weight decay from 0.20 to 0.05 will preserve its online accuracy gain under the fixed normalized final-two-layer probe, while lowering learning rate or adding OneCycle decay will not close the calibrated teacher gap.
mechanism: Freeze each retained encoder, extract the normalized concatenation of its final two CLS representations, and train the preregistered six-head learning-rate bank without backbone gradients.
rejection: Reject the lower-weight-decay hypothesis if its calibrated accuracy improves by less than 0.02 over the optimizer-screen baseline or if its pretraining run fails an online eligibility gate.

