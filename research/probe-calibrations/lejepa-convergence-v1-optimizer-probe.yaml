recipes:
  - id: last-two-cls-layernorm
    mode: last_two_cls
    normalize: true
    purpose: Reuse the fixed recipe selected by lejepa-convergence-v1-probe for every optimizer checkpoint.

probe:
  seed: 0
  epochs: 100
  feature_batch_size: 512
  probe_batch_size: 4096
  num_workers: 24
  learning_rates: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03]
  optimizer: adamw
  betas: [0.9, 0.999]
  weight_decay: 0.000001
  warmup_fraction: 0.10
  start_factor: 0.10
  schedule: linear-warmup-cosine
  final_factor: 0.001

data:
  root: /mnt/data/cifar10/cifar-10-batches-py
  split: fixed-45000-train-5000-validation
  train_transform: deterministic-validation-transform
  official_test_set: prohibited

resources:
  physical_gpus: [1, 2]
  workers: 2
  timeout_seconds: 7200
  retention: Retain feature caches, complete curves, results, and all source checkpoints.

decision:
  material_probe_lag_gain: 0.10
  shared_representation_floor: 0.60
  maximum_teacher_gap_for_probe_explanation: 0.20
  optimizer_baseline_source: optimizer-g2l2-w2-lr2e3-wd2e1-constant-seed0
  optimizer_accuracy_gain: 0.02
  pretraining_online_accuracy_floor: 0.50
  selection: Apply every preregistered pretraining eligibility gate first, then rank eligible optimizer sources by frozen accuracy, online active-time AUC, peak online accuracy, and schedule simplicity.
  next_step: If no optimizer candidate is eligible, retain the original optimizer as the control for a separately preregistered loss-interaction and view-cost study.

