id: lejepa-single-view-stopgrad-v1-probe
question: Does crop-free stopped-target MIM improve frozen representation quality over its shared-gradient control and remain equivalent to the retained multiview result?
hypothesis: Stopping the prediction target will raise the normalized final-two-CLS frozen probe by at least 0.01 over the crop-free control and finish within 0.03 of the retained multiview stopped-target accuracy.
mechanism: Freeze both fresh encoders, extract normalized final-two-layer CLS features, and train the established six-rate 100-epoch probe bank without backbone gradients.
screen_study: research/studies/lejepa-single-view-stopgrad-v1-screen.yaml
diagnostic_manifest: research/diagnostics/lejepa-single-view-stopgrad-v1-screen.yaml

sources:
  - id: single-view-shared-target-seed0
    role: control
    run_dir: logs/research/lejepa-single-view-stopgrad-v1-screen/runs/pretrain-single-view-shared-target-seed0
    online_probe_accuracy: 0.3174000084400177
    objective_complexity_rank: 0
    objective_cost_rank: 0
  - id: single-view-target-stopgrad-seed0
    role: candidate
    run_dir: logs/research/lejepa-single-view-stopgrad-v1-screen/runs/pretrain-single-view-target-stopgrad-seed0
    online_probe_accuracy: 0.3330000042915344
    objective_complexity_rank: 0
    objective_cost_rank: 0

recipes:
  - id: last-two-cls-layernorm
    mode: last_two_cls
    normalize: true
    purpose: Reuse the fixed recipe without tuning it on this comparison.

probe:
  seed: 0
  epochs: 100
  feature_batch_size: 512
  probe_batch_size: 4096
  num_workers: 24
  learning_rates: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03]
  optimizer: adamw
  betas: [0.9, 0.999]
  weight_decay: 0.000001
  warmup_fraction: 0.10
  start_factor: 0.10
  schedule: linear-warmup-cosine
  final_factor: 0.001

data:
  root: /mnt/data/cifar10/cifar-10-batches-py
  split: fixed-45000-train-5000-validation
  train_transform: deterministic-validation-transform
  official_test_set: prohibited

resources:
  physical_gpus: [1, 2]
  workers: 2
  timeout_seconds: 7200
  retention: Retain feature caches, complete curves, results, summaries, and both source checkpoints.

decision:
  source: research/studies/lejepa-single-view-stopgrad-v1-screen.yaml
  preregistered_resolution: Replace REQUIRED_TERMINAL_VALUE only with each source's exact terminal online probe accuracy before launch; do not alter the recipe or learning-rate bank.
  selection: Apply the committed safety, mechanism-support, and crop-free-equivalence gates only after the diagnostic is terminal.
  next_step: Run only the preregistered bottleneck follow-up warranted by the results; do not confirm, fine-tune, or use the official test set.

wandb:
  entity: tidalpaladin
  project: mjepa-cifar10
  group: lejepa-single-view-stopgrad-v1-probe
  authorized: true
  approved_data_classes: [metrics, configs, provenance]
  emitted_data_classes:
    launch: [metrics, configs, provenance]

code_shas:
  parent: REQUIRED
  mjepa: 578a2f92441394f232732348b6e9f569237b2744
  vit: bf15705454975f04912538cdc790d399eea69e67

log_root: logs/research
