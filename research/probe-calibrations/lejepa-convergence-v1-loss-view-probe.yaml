id: lejepa-convergence-v1-loss-view-probe
question: Which loss interaction, auxiliary objective, and view topology produces the best fixed frozen-probe accuracy and cost-quality tradeoff for the teacher-free SigREG JEPA?
hypothesis: Removing auxiliary CLS prediction will preserve its modest advantage over matched G2L2 lambda 0.05 weight 2, while the strong-invariance online lead will shrink under frozen probing because of its low effective rank; reducing local views or enlarging local crops will retain a frozen-accuracy deficit.
mechanism: Freeze the accepted teacher and all eight retained loss/view encoders, extract the normalized concatenation of each encoder's final two CLS representations, and train the preregistered six-head learning-rate bank without backbone gradients.
rejection: Reject a performance candidate unless frozen accuracy reaches 0.60, improves by 0.03 over the fresh lambda 0.10 weight 2 baseline, and its pretraining run passes every collapse gate. Reject a cost candidate unless common-step active time improves by 15%, frozen accuracy loses no more than 0.01 against matched G2L2 lambda 0.05 weight 2, isolated-path latency is lower, and every collapse gate passes.

