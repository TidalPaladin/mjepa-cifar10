id: lejepa-convergence-v1-probe
question: Does the moving online probe materially understate the final linear separability of the retained teacher-free SigREG representations?
hypothesis: A fresh frozen-backbone probe with negligible weight decay and a fixed learning-rate sweep will improve the best shared-student checkpoint by at least 0.10 validation accuracy, but a remaining accuracy below 0.60 or a teacher gap above 0.20 will show that representation convergence is still the primary limitation.
mechanism: Remove online representation drift and backbone optimizer coupling, then compare the existing final-layer CLS feature against the LeJEPA-style concatenation of normalized CLS features from the final two encoder layers.
rejection: Reject probe lag as the primary explanation if the best shared-student calibration gain is below 0.10 and its calibrated accuracy remains below 0.60.

