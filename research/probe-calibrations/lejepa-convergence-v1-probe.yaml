recipes:
  - id: final-cls-raw
    mode: final_cls
    normalize: false
    purpose: Isolate online-probe lag without changing the representation consumed by the classifier.
  - id: last-two-cls-layernorm
    mode: last_two_cls
    normalize: true
    purpose: Measure the evaluation gap from the practical LeJEPA linear-probe feature recipe.

probe:
  seed: 0
  epochs: 100
  feature_batch_size: 512
  probe_batch_size: 4096
  num_workers: 24
  learning_rates: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03]
  optimizer: adamw
  betas: [0.9, 0.999]
  weight_decay: 0.000001
  warmup_fraction: 0.10
  start_factor: 0.10
  schedule: linear-warmup-cosine
  final_factor: 0.001

data:
  root: /mnt/data/cifar10/cifar-10-batches-py
  split: fixed-45000-train-5000-validation
  train_transform: deterministic-validation-transform
  official_test_set: prohibited

resources:
  physical_gpus: [1, 2]
  workers: 2
  timeout_seconds: 7200
  retention: Retain feature caches, complete curves, and all source checkpoints.

decision:
  material_probe_lag_gain: 0.10
  shared_representation_floor: 0.60
  maximum_teacher_gap_for_probe_explanation: 0.20
  next_step: If representation convergence remains primary, preregister a fresh optimizer and schedule screen without changing the calibrated evaluation protocol.

