id: lejepa-token-diversity-v1-long-probe
question: How much of the long-horizon teacher-free online-probe gap is explained by classifier calibration rather than encoder quality?
hypothesis: Fixed calibration will improve the long-horizon teacher-free endpoint, but its frozen representation will remain at least 0.08 below the teacher baseline.
mechanism: Freeze both retained encoders, extract the normalized concatenation of their final two CLS representations, and train the established six-head learning-rate bank without backbone gradients.
rejection: Reject a representation-primary diagnosis if the shared-student frozen probe reaches within 0.05 of the teacher baseline.

sources:
  - id: teacher-baseline-seed0
    role: teacher-baseline
    run_dir: logs/research/vit-small-baseline-v1/runs/pretrain-baseline-seed0
    online_probe_accuracy: 0.9058
  - id: shared-long-horizon-seed0
    role: shared-student-candidate
    run_dir: logs/research/lejepa-convergence-v2-long-horizon/runs/pretrain-g2l2-l005-w4-397e-seed0
    online_probe_accuracy: 0.8150

recipes:
  - id: last-two-cls-layernorm
    mode: last_two_cls
    normalize: true
    purpose: Reuse the fixed recipe from the completed convergence studies without retuning it on the long-horizon result.

probe:
  seed: 0
  epochs: 100
  feature_batch_size: 512
  probe_batch_size: 4096
  num_workers: 24
  learning_rates: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03]
  optimizer: adamw
  betas: [0.9, 0.999]
  weight_decay: 0.000001
  warmup_fraction: 0.10
  start_factor: 0.10
  schedule: linear-warmup-cosine
  final_factor: 0.001

data:
  root: /mnt/data/cifar10/cifar-10-batches-py
  split: fixed-45000-train-5000-validation
  train_transform: deterministic-validation-transform
  official_test_set: prohibited

resources:
  physical_gpus: [1, 2]
  workers: 2
  timeout_seconds: 7200
  retention: Retain feature caches, complete curves, results, and all source checkpoints.

decision:
  material_probe_lag_gain: 0.05
  shared_representation_floor: 0.80
  maximum_teacher_gap_for_probe_explanation: 0.05

wandb:
  entity: tidalpaladin
  project: mjepa-cifar10
  group: lejepa-token-diversity-v1-long-probe
  authorized: true
  approved_data_classes: [metrics, configs, provenance]
  emitted_data_classes:
    launch: [metrics, configs, provenance]

code_shas:
  parent: REQUIRED
  mjepa: 8f9eab6beb6a0e1f9547e90ed8ce0d5e7bde42c6
  vit: bf15705454975f04912538cdc790d399eea69e67

log_root: logs/research
