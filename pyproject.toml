[build-system]
requires = [
    "hatchling==1.31.0",
    "hatch-vcs==0.5.0",
]
build-backend = "hatchling.build"

[project]
name = "mjepa-cifar10"
description = ""
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Scott Chase Waggener", email = "chase.waggener@icloud.com" },
]
dependencies = [
    "filelock==3.31.1",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "pyyaml==6.0.3",
    "torchmetrics==1.9.0",
    "safetensors==0.8.0",
    "tqdm==4.68.4",
    "vit",
    "mjepa",
    "wandb==0.28.1",
    "notify-wake-runtime==1.0.0",
]

readme = "README.md"
dynamic = [
    "version",
]

[tool.uv.sources]
vit = { git = "https://github.com/TidalPaladin/vit.git", rev = "5884448b157ff13529fc49fb8e86283868540607" }
mjepa = { git = "https://github.com/TidalPaladin/mjepa.git", rev = "e0bb8c22feb40eb284abdd14b65006c1a09e2af2" }
notify-wake-runtime = { git = "https://github.com/TidalPaladin/skills.git", rev = "61a4a819c58243d54e3c99c684ec23ad88e6dfef", subdirectory = "notify-wake" }

# For local sibling-repo testing, comment the git sources above and uncomment these:
# vit = { path = "../vit", editable = true }
# mjepa = { path = "../mjepa", editable = true }

[dependency-groups]
dev = [
    "ruff==0.15.22",
    "basedpyright==1.39.9",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "pytest-env==1.6.0",
    "coverage==7.15.2",
    "pdbpp==0.12.1",
]

[project.license]
text = "Apache"

[project.optional-dependencies]

[tool.ruff]
line-length = 120
extend-exclude = ["_version.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
]

[tool.ruff.lint.isort]
lines-after-imports = 2
force-single-line = false

[tool.basedpyright]
include = ["mjepa_cifar10", "scripts", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "**/.pytest_cache", "**/_version.py"]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "standard"

[tool.uv]
required-version = "==0.11.28"
override-dependencies = [
    "vit @ git+https://github.com/TidalPaladin/vit.git@5884448b157ff13529fc49fb8e86283868540607",
]

[tool.pytest.ini_options]
markers = [
    "ci_skip",
]
filterwarnings = []

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "mjepa_cifar10/_version.py"

# Set to true to allow installing git dependencies
[tool.hatch.metadata]
allow-direct-references = true
