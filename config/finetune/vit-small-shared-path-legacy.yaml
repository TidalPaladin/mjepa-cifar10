# Legacy shared-path fine-tuning config for checkpoints created before token specialization became the default.
# Assumes 2xGPUs.
trainer: !!python/object:mjepa.TrainerConfig
  batch_size: 512
  num_workers: 24
  num_epochs: 100
  check_val_every_n_epoch: 2
  accumulate_grad_batches: 2

backbone: !!python/object:vit.ViTConfig
  in_channels: 3
  hidden_size: 384
  ffn_hidden_size: 1536
  patch_size: [4, 4]
  img_size: [32, 32]
  depth: 12
  num_attention_heads: 12
  activation: "swiglu"
  mlp_bias: true
  attention_bias: false
  attention_dropout: 0.1
  hidden_dropout: 0.1
  drop_path_rate: 0.1
  num_register_tokens: 7
  num_cls_tokens: 1
  pos_enc: "rope"
  rope_base: 100
  rope_rescale_coords: 2.0
  rope_shift_coords: null
  rope_jitter_coords: null
  rope_normalize_coords: "separate"
  layer_scale: 0.00001
  norm_type: "layernorm"
  qk_normalization: true
  dtype: float32
  heads:
    cls: !!python/object:vit.HeadConfig
      out_features: 10
      dropout: 0.1

optimizer: !!python/object:mjepa.OptimizerConfig
  lr: 0.0002
  weight_decay: 0.2
  betas: [0.85, 0.95]
  fused: true
  scheduled: true
  div_factor: 10
  final_div_factor: 100
  pct_start: 0.10
  skip_weight_decay_on_1d: true
  parameter_groups:
    - params: ["cls_tokens", "register_tokens", "pos_enc_target", "positions"]
      weight_decay: 0.0
    - params: ["heads", "predictor_proj"]
      weight_decay: 1.0
