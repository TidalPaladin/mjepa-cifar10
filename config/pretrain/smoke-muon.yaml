# One-epoch GPU smoke configuration for hybrid Muon in the managed research harness.
trainer: !!python/object:mjepa.TrainerConfig
  batch_size: 512
  num_workers: 4
  num_epochs: 1
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  log_interval: 10

backbone: !!python/object:vit.ViTConfig
  in_channels: 3
  hidden_size: 64
  ffn_hidden_size: 256
  patch_size: [4, 4]
  img_size: [32, 32]
  depth: 2
  num_attention_heads: 4
  activation: swiglu
  mlp_bias: true
  attention_bias: false
  attention_dropout: 0.0
  hidden_dropout: 0.0
  drop_path_rate: 0.0
  num_register_tokens: 2
  num_cls_tokens: 2
  pos_enc: rope
  rope_base: 100
  rope_rescale_coords: 2.0
  rope_shift_coords: null
  rope_jitter_coords: null
  rope_normalize_coords: separate
  layer_scale: 0.00001
  norm_type: layernorm
  qk_normalization: true
  dtype: float32
  heads:
    cls: !!python/object:vit.HeadConfig
      out_features: 10
      dropout: 0.0

jepa: !!python/object:mjepa.JEPAConfig
  momentum: 0.98
  predictor_depth: 1
  predictor_attention_mode: cross_attention
  context_ratio: 0.5
  target_ratio: 0.25
  scale: 2
  scheduled: false
  use_gram_anchoring: false
  gram_start_epoch: null
  sigreg_loss_weight: 0.0001

optimizer: !!python/object:mjepa.OptimizerConfig
  kind: hybrid_muon
  lr: 0.001
  adamw_lr: 0.001
  weight_decay: 0.05
  betas: [0.9, 0.999]
  fused: true
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_coefficients: [3.4445, -4.7750, 2.0315]
  muon_eps: 0.0000001
  muon_ns_steps: 5
  muon_adjust_lr_fn: match_rms_adamw
  log_hybrid_adamw_parameters: true
  scheduled: false
  div_factor: 10
  final_div_factor: 100
  skip_weight_decay_on_1d: true
  parameter_groups:
    - params: [cls_tokens, register_tokens, pos_enc_target, positions]
      optimizer: adamw
      weight_decay: 0.0
    - params: [heads]
      optimizer: adamw
